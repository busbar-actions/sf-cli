name: 'Busbar — sf-cli'
description: 'Run a declarative Salesforce CLI action inside a managed nono capability sandbox, every request decided by the Salesforce request policy and this repository''s Cedar policies, with a full audit trail and a run record.'
author: 'Busbar'

# A single declarative action (SfAction JSON) is executed inside a busbar-sandbox
# session: a nono capability sandbox whose network egress is kernel-forced through
# an in-process injecting proxy (`ProxyOnly`). The run records exactly which
# endpoints the `sf` invocation hit and the outcome, persisted as artifacts.
#
# THE HARNESS: `sf-cli exec` is an Action on the Busbar Action framework's
# harness and takes no flags. Its inputs are exactly the `INPUT_*` variables
# the exec step maps below (an `INPUT_*` naming no input refuses the run),
# over this repository's `.busbar/actions/sf-cli.{json,yaml}` on its default
# branch. The harness declares the run (the typed inputs, the grant, the job's
# signed identity), loads this repository's `.busbar/policies/*.cedar` and asks
# them whether a session may be minted (`Busbar::Action::"session.mint"`),
# mints, runs the action, delivers the outputs, writes the run record
# (`run-report-path`) and disposes of the credential on every path.
#
# AUTH (zero stored credentials): the harness mints a short-lived Salesforce
# session from the runner's GitHub OIDC id-token (exchanged at the
# Busbar-equipped org on `target-instance`) and HOLDS that token in the
# supervisor's own memory. The managed `sf` CLI names the org by a PLACEHOLDER
# token; the proxy swaps in the real `Authorization` header server-side, so
# the `~/.sf` entry that lands on disk carries only the placeholder and the
# managed `sf` NEVER holds the real bearer token. At the end of the run the
# session is revoked + zeroized. There is NO org-auth handoff step, NO token
# input and NO token written to GITHUB_ENV; a run whose environment carries a
# Salesforce token (SF_ACCESS_TOKEN) is refused before anything is minted.
#
# CONFINEMENT is unconditional: egress is kernel-enforced ProxyOnly (Landlock v4 /
# kernel 6.7+ on Linux runners), so if the host lacks kernel support, the
# sandbox fails closed rather than running unconfined.
#
# ENFORCEMENT: every request `sf` sends is shown to the Salesforce request
# policy in full (request line, headers, body) before the credential is
# injected, and decided by what it does, whatever `sf` release sent it (no
# `sf-cli-version` pin is needed). Payload SOQL is parsed only in a confined,
# credential-free helper process. Every run also applies this repository's
# `.busbar/policies/*.cedar`, read from the head of the default branch with
# `github-token` (the supervisor only; never given to `sf`): a policy may
# forbid the mint itself, or any operation, e.g. a query whose risk score is
# too high for a production org. An invalid policy set fails the run before
# anything is minted. The proxy removes every header it does not forward
# before the policy sees the request (the request goes on without it);
# `.busbar/door.toml` on the default branch can name more headers to forward.
#
# The caller MUST grant the job `permissions: id-token: write` (so GitHub injects
# the OIDC request endpoint) and `contents: read` (so the supervisor can read
# the repository's policies), and set `target-instance` to the Busbar-equipped
# org instance URL.
inputs:
  action:
    description: 'The declarative action as an SfAction document, JSON or YAML (e.g. {"action":"data_query","target_org":"my-org","soql":"SELECT Id FROM Account"}).'
    required: true
  target-instance:
    description: 'Instance URL of the Busbar-equipped Salesforce org to mint a session against via GitHub OIDC (https, no path, no trailing slash). REQUIRED; the job must grant `permissions: id-token: write`.'
    required: false
    default: ''
  eca-client-id:
    description: 'Consumer key of the External Client App in the Busbar-equipped org (non-secret). Defaults to the baked public key when empty.'
    required: false
    default: ''
  token-handler:
    description: 'Apex token-exchange handler dev name. Defaults to `GitHubTokenExchangeHandler` when empty.'
    required: false
    default: ''
  oidc-audience:
    description: 'OIDC token audience. Defaults to `target-instance` when empty.'
    required: false
    default: ''
  sf-cli-version:
    description: 'npm version spec for `@salesforce/cli` to install (e.g. `2.151.7`, or `latest`). Any release works: the request policy decides by what each request does, not by the CLI version. Pin one only for reproducibility.'
    required: false
    default: 'latest'
  github-token:
    description: >-
      GitHub token the sf-cli supervisor uses to read this repository's
      default branch, its `.busbar/actions/sf-cli.{json,yaml}`,
      `.busbar/policies` and `.busbar/door.toml` through the GitHub REST API.
      Needs `contents: read`: with the default (the job's own token) grant
      `permissions: contents: read`. Never given to `sf`.
    required: false
    default: ${{ github.token }}
  working-dir:
    description: 'Working directory for the `sf` invocation.'
    required: false
    default: ''
  output:
    description: 'Path to write the structured `sf` result JSON (in addition to stdout).'
    required: false
    default: ''
  audit-out:
    description: 'Path to write the JSON audit log for this run.'
    required: false
    default: '.busbar/logs/sandbox-audit.json'
  artifact-name:
    description: >-
      Name for the uploaded audit log + run record artifact. Must be UNIQUE
      within a workflow run (set a distinct value per sf-cli step).
    required: false
    default: 'busbar-sandbox-sf'
  version:
    description: 'Release tag of the sf-cli binary. Falls back to env.BUSBAR_ACTION_VERSION, then "latest".'
    required: false
    default: ''
  binary-repo:
    description: 'GitHub repo hosting prebuilt binary releases. Falls back to env.BUSBAR_ACTION_REPO, then busbar-actions/actions-dist.'
    required: false
    default: ''

outputs:
  success:
    description: '"true" when the action executed successfully, "false" when `sf` failed.'
    value: ${{ steps.exec.outputs.success }}
  duration-ms:
    description: 'Wall-clock duration of the sf invocation in milliseconds.'
    value: ${{ steps.exec.outputs.duration-ms }}
  risk-level:
    description: 'Inherent risk level of the action (low | medium | high | critical).'
    value: ${{ steps.exec.outputs.risk-level }}
  sandbox-enforced:
    description: '"true" when kernel-enforced confinement was applied.'
    value: ${{ steps.exec.outputs.sandbox-enforced }}
  audit-path:
    description: 'Path to the JSON audit log written for this run.'
    value: ${{ steps.exec.outputs.audit-path }}
  result-path:
    description: 'Path to the structured sf result JSON (only when `output` was set).'
    value: ${{ steps.exec.outputs.result-path }}
  run-report-path:
    description: 'Path to the run record the harness wrote (the declaration with its recorded facts, the outcome, the policy report, the sandbox record and the run journal; under RUNNER_TEMP).'
    value: ${{ steps.exec.outputs.run-report-path }}
  org-kind:
    description: 'How the target org was classified (scratch | sandbox | production; anything doubtful is production).'
    value: ${{ steps.exec.outputs.org-kind }}
  claim-status:
    description: 'Whether the run is claim-eligible (eligible | ineligible).'
    value: ${{ steps.exec.outputs.claim-status }}
  policy-denied:
    description: 'How many requests the Salesforce request policy denied (each reached `sf` as HTTP 403).'
    value: ${{ steps.exec.outputs.policy-denied }}
  sf-cli-path:
    description: 'Path to the managed sf binary installed for this run.'
    value: ${{ steps.install.outputs.sf-cli-path }}
  sf-cli-prefix:
    description: 'Prefix directory containing the managed sf install.'
    value: ${{ steps.install.outputs.sf-cli-prefix }}
  sf-cli-version:
    description: 'Version of @salesforce/cli that was installed.'
    value: ${{ steps.install.outputs.sf-cli-version }}

runs:
  using: 'composite'
  steps:
    - name: Install the sf-cli binary from actions-dist
      uses: busbar-actions/setup@main
      with:
        binary: sf-cli
        version: ${{ inputs.version || env.BUSBAR_ACTION_VERSION || 'latest' }}
        binary-repo: ${{ inputs.binary-repo || env.BUSBAR_ACTION_REPO || 'busbar-actions/actions-dist' }}

    - name: Install the managed @salesforce/cli (version ${{ inputs.sf-cli-version }}) under RUNNER_TEMP
      id: install
      shell: bash
      env:
        INPUT_SF_CLI_VERSION: ${{ inputs.sf-cli-version }}
      run: |
        set -euo pipefail
        install_dir="${RUNNER_TEMP}/managed-sf-cli"
        echo "Installing @salesforce/cli@${INPUT_SF_CLI_VERSION} into ${install_dir}"
        sf-cli install --version "$INPUT_SF_CLI_VERSION" --install-dir "$install_dir"

    - name: Run the declarative SfAction in the busbar-sandbox (ProxyOnly) against the Busbar-equipped org
      id: exec
      shell: bash
      # `sf-cli exec` takes no flags. Its inputs are exactly the INPUT_* variables
      # below, one per input the Action declares (`action`, `sf_cli_path`,
      # `working_dir`, `output`, `audit_out`); the harness refuses any other
      # INPUT_*. An empty value is an unset input. The action document is passed
      # inline (JSON or YAML; the harness loads it as a document), never
      # interpolated into the script.
      #
      # AUTH: the harness mints the Salesforce session in-process from the OIDC
      # config below and holds the token in the supervisor. `sf` names the org
      # by a placeholder; it never holds the real token. Empty auth-config vars
      # fall back to the baked defaults. There is NO token-input escape hatch:
      # OIDC via `target-instance` is the only auth path, no exceptions. No
      # token is written to GITHUB_ENV.
      env:
        INPUT_ACTION: ${{ inputs.action }}
        INPUT_SF_CLI_PATH: ${{ steps.install.outputs.sf-cli-path }}
        INPUT_WORKING_DIR: ${{ inputs.working-dir }}
        INPUT_OUTPUT: ${{ inputs.output }}
        INPUT_AUDIT_OUT: ${{ inputs.audit-out }}
        SF_INSTANCE_URL: ${{ inputs.target-instance || env.SF_INSTANCE_URL }}
        ECA_CLIENT_ID: ${{ inputs.eca-client-id }}
        TOKEN_HANDLER_APEX: ${{ inputs.token-handler }}
        OIDC_AUDIENCE: ${{ inputs.oidc-audience }}
        # Read by the sf-cli supervisor only (from its environment, never an
        # argument or an input), for the repository's input file, policies and
        # door configuration. The sandboxed `sf` starts from an explicit
        # environment that never carries a GITHUB_* variable, and the decode
        # helper gets no environment at all.
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        echo "Executing the SfAction in the busbar-sandbox (ProxyOnly) against ${SF_INSTANCE_URL} (audit -> ${INPUT_AUDIT_OUT})"
        sf-cli exec

    - name: Upload the audit log and the run record
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ inputs.audit-out }}
          ${{ steps.exec.outputs.run-report-path }}
        if-no-files-found: warn
        retention-days: 30
